<!DOCTYPE html>
<html lang="es" data-theme="mocha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java UQ — Lógica de Programación</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --panel: #181825;
      --surface: #313244;
      --hover: #45475a;
      --border: #313244;
      --text: #cdd6f4;
      --muted: #a6adc8;
      --blue: #89b4fa;
      --blue-bg: #313f5a;
      --green: #a6e3a1;
      --wallpaper-shade: rgba(24, 24, 37, .48);
      --glass: rgba(24, 24, 37, .80);
    }
    [data-theme="latte"] {
      --bg: #eff1f5;
      --panel: #e6e9ef;
      --surface: #dce0e8;
      --hover: #ccd0da;
      --border: #ccd0da;
      --text: #4c4f69;
      --muted: #6c6f85;
      --blue: #1e66f5;
      --blue-bg: #dce8ff;
      --green: #40a02b;
      --wallpaper-shade: rgba(239, 241, 245, .43);
      --glass: rgba(255, 255, 255, .82);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; color: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .app { display: grid; grid-template-columns: 220px 320px minmax(0, 1fr); height: 100vh; }
    .sidebar, .list-panel, .details { min-width: 0; overflow: auto; }
    .sidebar { background: var(--panel); padding: 18px 12px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; }
    .logo { display: block; flex: 0 0 auto; width: 42px; height: 42px; padding: 3px; object-fit: contain; border-radius: 50%; border: 1px solid var(--border); background: #fff; }
    .brand strong { display: block; font-size: 15px; }
    .photo-credit { display: inline-block; margin-top: 2px; color: var(--muted); font-size: 10px; text-decoration: none; }
    .photo-credit:hover { color: var(--blue); text-decoration: underline; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .section-label { color: var(--muted); padding: 8px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .categories { display: grid; gap: 3px; }
    .category { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; color: var(--muted); }
    .category:hover, .exercise:hover { background: var(--surface); }
    .category.active { background: var(--blue-bg); color: var(--blue); }
    .category span:first-child { width: 18px; text-align: center; }
    .count { margin-left: auto; font-size: 11px; }
    .sidebar-bottom { margin-top: auto; padding: 16px 4px 0; }
    .plain-button { border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 7px 10px; }
    .plain-button:hover { background: var(--hover); }
    .list-panel { background: #11111b; border-right: 1px solid var(--border); }
    [data-theme="latte"] .list-panel { background: #fff; }
    .list-head { padding: 18px 15px 12px; border-bottom: 1px solid var(--border); }
    .list-title-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
    .list-title { font-size: 16px; font-weight: 750; }
    .search { width: 100%; padding: 10px 12px; border: 1px solid transparent; border-radius: 8px; background: var(--surface); color: var(--text); }
    .search:focus { outline: none; border-color: var(--blue); }
    .exercise-list { padding: 6px; }
    .exercise { display: block; width: 100%; padding: 11px 10px; margin-bottom: 2px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
    .exercise.active { background: var(--blue-bg); }
    .exercise.active strong { color: var(--blue); }
    .exercise strong { display: block; overflow-wrap: anywhere; font-size: 13px; }
    .exercise .desc { display: -webkit-box; overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 12px; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .details {
      padding: 0;
      position: relative;
      background-color: var(--bg);
      background-image: linear-gradient(var(--wallpaper-shade), var(--wallpaper-shade)), url("https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Lake_near_Sunnig_Grat_summit.JPG/1280px-Lake_near_Sunnig_Grat_summit.JPG");
      background-position: center;
      background-size: cover;
      background-attachment: local;
    }
    .details-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 22px; border-bottom: 1px solid var(--border); background: var(--panel); }
    .content {
      max-width: 760px;
      margin: 30px auto;
      padding: 30px 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .eyebrow { margin-bottom: 8px; color: var(--blue); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); line-height: 1.2; overflow-wrap: anywhere; }
    .description { margin: 12px 0 24px; color: var(--muted); font-size: 15px; }
    .path-label { margin-bottom: 8px; font-size: 13px; font-weight: 700; }
    .path-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
    code { color: var(--green); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
    .welcome { display: grid; place-items: center; min-height: calc(100vh - 60px); padding: 25px; text-align: center; }
    .welcome-icon { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 18px; padding: 5px; overflow: hidden; border: 1px solid var(--border); border-radius: 22px; background: #fff; }
    .welcome-icon img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .welcome > div { max-width: 430px; padding: 28px; border: 1px solid var(--border); border-radius: 18px; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .wallpaper-credit { position: absolute; right: 10px; bottom: 8px; z-index: 2; max-width: calc(100% - 20px); padding: 3px 7px; border-radius: 5px; color: var(--text); background: var(--glass); font-size: 10px; text-decoration: none; backdrop-filter: blur(8px); }
    .wallpaper-credit:hover { color: var(--blue); }
    .welcome h1 { font-size: 24px; margin-bottom: 10px; }
    .welcome p { max-width: 330px; color: var(--muted); }
    .empty { padding: 24px 12px; text-align: center; color: var(--muted); }
    @media (max-width: 850px) {
      .app { grid-template-columns: 190px minmax(240px, 300px) minmax(0, 1fr); }
      .content { margin: 18px 12px; padding: 24px 18px; }
    }
    @media (max-width: 650px) {
      .app { display: block; height: 100dvh; }
      .sidebar { display: none; }
      .list-panel, .details { height: 100%; }
      .details { display: none; }
      .app.show-details .list-panel { display: none; }
      .app.show-details .details { display: block; }
      .details-head { padding: 10px 12px; }
      .content { margin: 18px 12px; padding: 24px 18px; }
      .welcome { min-height: calc(100dvh - 55px); }
      .mobile-back { display: inline-block !important; }
    }
    .mobile-back { display: none; }
  </style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Java_Cup.png" alt="Taza de Java" title="Java Cup.png · Jaxom / Wikimedia Commons · CC BY-SA 1.0">
      <div><strong>Java UQ</strong><div class="muted small">Lógica de Programación</div><a class="photo-credit" href="https://commons.wikimedia.org/wiki/File:Java_Cup.png" target="_blank" rel="noopener noreferrer">Foto: Jaxom / Wikimedia Commons</a></div>
    </div>
    <div class="section-label">Categorías</div>
    <nav class="categories" id="categories">
      <button class="category active" data-category="todos"><span>▦</span>Todos <span class="count">24</span></button>
      <button class="category" data-category="fundamentos"><span>◈</span>Fundamentos <span class="count">3</span></button>
      <button class="category" data-category="operadores"><span>±</span>Operadores <span class="count">3</span></button>
      <button class="category" data-category="expresiones"><span>ƒ</span>Expresiones <span class="count">2</span></button>
      <button class="category" data-category="condicionales"><span>⑂</span>Condicionales <span class="count">4</span></button>
      <button class="category" data-category="ciclos"><span>↻</span>Ciclos <span class="count">4</span></button>
      <button class="category" data-category="metodos"><span>λ</span>Métodos <span class="count">2</span></button>
      <button class="category" data-category="cadenas"><span>Aa</span>Cadenas <span class="count">3</span></button>
      <button class="category" data-category="retos"><span>✳</span>Retos <span class="count">3</span></button>
    </nav>
    <div class="sidebar-bottom"><button class="plain-button" id="themeToggle">☼ Cambiar tema</button></div>
  </aside>

  <section class="list-panel">
    <header class="list-head">
      <div class="list-title-row"><div class="list-title" id="listTitle">Todos los ejercicios</div><span class="muted small" id="resultCount">24</span></div>
      <input class="search" id="search" type="search" placeholder="⌕  Buscar ejercicios..." aria-label="Buscar ejercicios">
    </header>
    <div class="exercise-list" id="exerciseList"></div>
  </section>

  <main class="details" id="details">
    <header class="details-head">
      <div><strong>Detalles</strong><div class="muted small">Lógica de Programación · UQ</div></div>
      <button class="plain-button mobile-back" id="backButton">← Volver</button>
    </header>
    <div id="detailContent" class="welcome"><div><div class="welcome-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Java_Cup.png" alt="Taza de Java"></div><h1>Tu biblioteca de Java</h1><p>Selecciona un ejercicio para ver su descripción y la ruta del archivo.</p></div></div>
    <a class="wallpaper-credit" href="https://commons.wikimedia.org/wiki/File:Lake_near_Sunnig_Grat_summit.JPG" target="_blank" rel="noopener noreferrer">Paisaje: Simon Koopmann / Wikimedia Commons · CC BY-SA</a>
  </main>
</div>

<script>
  const exercises = [
    { title: "TipoDato.java", category: "fundamentos", desc: "Uso y declaración de los diferentes tipos de datos primitivos en Java.", path: "ejercicios/fundamentos/TipoDato.java" },
    { title: "VariablesyConstantes.java", category: "fundamentos", desc: "Diferencia entre variables modificables y constantes con final.", path: "ejercicios/fundamentos/VariablesyConstantes.java" },
    { title: "EjercicioNovato.java", category: "fundamentos", desc: "Prácticas iniciales de sintaxis e impresión en consola.", path: "ejercicios/fundamentos/EjercicioNovato.java" },
    { title: "Operadores.java", category: "operadores", desc: "Operaciones aritméticas, lógicas y relacionales básicas.", path: "ejercicios/operadores/Operadores.java" },
    { title: "PracticaOperadores.java", category: "operadores", desc: "Ejercicios de asignación e incremento y decremento.", path: "ejercicios/operadores/PracticaOperadores.java" },
    { title: "AnalizadorAbecedario.java", category: "operadores", desc: "Análisis y operaciones con caracteres del abecedario.", path: "ejercicios/operadores/AnalizadorAbecedario.java" },
    { title: "CuboNumeros.java", category: "expresiones", desc: "Cálculo de potencias y cubos mediante expresiones matemáticas.", path: "ejercicios/expresiones/CuboNumeros.java" },
    { title: "MatematicaBrillante.java", category: "expresiones", desc: "Evaluación de fórmulas y operaciones aritméticas.", path: "ejercicios/expresiones/MatematicaBrillante.java" },
    { title: "NotaDefinitiva.java", category: "condicionales", desc: "Cálculo de notas y estado de aprobación del estudiante.", path: "ejercicios/condicionales/NotaDefinitiva.java" },
    { title: "DescuentoTienda.java", category: "condicionales", desc: "Cálculo de descuentos según el monto de compra.", path: "ejercicios/condicionales/DescuentoTienda.java" },
    { title: "ClasificacionNumero.java", category: "condicionales", desc: "Determina si un número es positivo, negativo, par o impar.", path: "ejercicios/condicionales/ClasificacionNumero.java" },
    { title: "PasajeAvion.java", category: "condicionales", desc: "Cobro de boletos según distancia y edad del pasajero.", path: "ejercicios/condicionales/PasajeAvion.java" },
    { title: "FactorialOcho.java", category: "ciclos", desc: "Cálculo iterativo del factorial usando bucles.", path: "ejercicios/ciclos/FactorialOcho.java" },
    { title: "SumaCuadrados.java", category: "ciclos", desc: "Suma de los cuadrados de una serie de números.", path: "ejercicios/ciclos/SumaCuadrados.java" },
    { title: "SerieFraccionaria.java", category: "ciclos", desc: "Generación y cálculo de una serie fraccionaria.", path: "ejercicios/ciclos/SerieFraccionaria.java" },
    { title: "MultiplicacionImpares.java", category: "ciclos", desc: "Multiplicación acumulada de números impares en un rango.", path: "ejercicios/ciclos/MultiplicacionImpares.java" },
    { title: "OperacionesNumeros.java", category: "metodos", desc: "Operaciones matemáticas organizadas en métodos reutilizables.", path: "ejercicios/metodos/OperacionesNumeros.java" },
    { title: "Reutilizacion.java", category: "metodos", desc: "Llamadas a métodos con parámetros y valores de retorno.", path: "ejercicios/metodos/Reutilizacion.java" },
    { title: "EjerciciosStrings.java", category: "cadenas", desc: "Operaciones con String: manipulación, longitud y caracteres.", path: "ejercicios/cadenas/EjerciciosStrings.java" },
    { title: "TraductorEspanolBinario.java", category: "cadenas", desc: "Conversión de texto a su representación binaria.", path: "ejercicios/cadenas/TraductorEspanolBinario.java" },
    { title: "DisenoAscii.java", category: "cadenas", desc: "Generación de figuras y arte ASCII desde Java.", path: "ejercicios/cadenas/DisenoAscii.java" },
    { title: "AnalizadorEmocional.java", category: "retos", desc: "Ejercicio de análisis de patrones y clasificación lógica.", path: "ejercicios/retos/AnalizadorEmocional.java" },
    { title: "AtletasDelFuturo.java", category: "retos", desc: "Cálculo de estadísticas de rendimiento deportivo.", path: "ejercicios/retos/AtletasDelFuturo.java" },
    { title: "EDEQFinanzas.java", category: "retos", desc: "Simulación de estados financieros y cálculos tarifarios.", path: "ejercicios/retos/EDEQFinanzas.java" }
  ];

  const names = { todos: "Todos los ejercicios", fundamentos: "Fundamentos", operadores: "Operadores", expresiones: "Expresiones", condicionales: "Condicionales", ciclos: "Ciclos", metodos: "Métodos", cadenas: "Cadenas", retos: "Retos" };
  const app = document.getElementById("app");
  const list = document.getElementById("exerciseList");
  const search = document.getElementById("search");
  const detailContent = document.getElementById("detailContent");
  let category = "todos";
  let query = "";
  let selected = "";

  function filteredExercises() {
    return exercises.filter(ex => (category === "todos" || ex.category === category) && `${ex.title} ${ex.desc} ${ex.path}`.toLocaleLowerCase("es").includes(query));
  }

  function render() {
    document.getElementById("listTitle").textContent = names[category];
    const results = filteredExercises();
    document.getElementById("resultCount").textContent = results.length;
    list.replaceChildren();
    if (!results.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No se encontraron ejercicios.";
      list.appendChild(empty);
      return;
    }
    results.forEach(ex => {
      const button = document.createElement("button");
      button.className = "exercise" + (selected === ex.path ? " active" : "");
      button.type = "button";
      const title = document.createElement("strong");
      title.textContent = ex.title;
      const desc = document.createElement("span");
      desc.className = "desc";
      desc.textContent = ex.desc;
      button.append(title, desc);
      button.addEventListener("click", () => showDetails(ex));
      list.appendChild(button);
    });
  }

  function showDetails(ex) {
    selected = ex.path;
    render();
    detailContent.className = "content";
    detailContent.replaceChildren();
    const eyebrow = document.createElement("div");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = names[ex.category];
    const title = document.createElement("h1");
    title.textContent = ex.title;
    const desc = document.createElement("p");
    desc.className = "description";
    desc.textContent = ex.desc;
    const label = document.createElement("div");
    label.className = "path-label";
    label.textContent = "Ruta del archivo";
    const pathBox = document.createElement("div");
    pathBox.className = "path-box";
    const path = document.createElement("code");
    path.textContent = ex.path;
    const copy = document.createElement("button");
    copy.className = "plain-button";
    copy.textContent = "Copiar";
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(ex.path); copy.textContent = "Copiado ✓"; }
      catch { copy.textContent = "No disponible"; }
      setTimeout(() => copy.textContent = "Copiar", 1200);
    });
    pathBox.append(path, copy);
    detailContent.append(eyebrow, title, desc, label, pathBox);
    if (matchMedia("(max-width: 650px)").matches) app.classList.add("show-details");
  }

  document.getElementById("categories").addEventListener("click", event => {
    const button = event.target.closest("[data-category]");
    if (!button) return;
    category = button.dataset.category;
    document.querySelectorAll(".category").forEach(item => item.classList.toggle("active", item === button));
    render();
  });
  search.addEventListener("input", () => { query = search.value.trim().toLocaleLowerCase("es"); render(); });
  document.getElementById("themeToggle").addEventListener("click", () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === "mocha" ? "latte" : "mocha";
  });
  document.getElementById("backButton").addEventListener("click", () => app.classList.remove("show-details"));
  render();
</script>
</body>
</html>
